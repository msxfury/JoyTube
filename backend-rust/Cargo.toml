[package]
name = "joytube-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
bytes = "=1.10.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net"] }
